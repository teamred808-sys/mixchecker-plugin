name: Windows VST3

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
    outputs:
      unsigned-artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DMIXCHECKER_BUILD_VST3=ON
          -DMIXCHECKER_BUILD_AU=OFF
          -DMIXCHECKER_BUILD_AAX=OFF
          -DMIXCHECKER_BUILD_STANDALONE=OFF
          -DMIXCHECKER_BUILD_TESTS=ON

      - name: Build VST3 and tests
        run: cmake --build build --config Release --target MixChecker_VST3 MixCheckerUpdateCheckerTests MixCheckerConnectionTests

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify VST3 output and version
        shell: pwsh
        run: |
          $plugin = "build/MixChecker_artefacts/Release/VST3/MixChecker.vst3"
          if (-not (Test-Path $plugin)) { throw "Expected VST3 bundle was not produced: $plugin" }
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch '(?m)^project\(MixChecker\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)\)') { throw "Missing project version" }
          $expected = $Matches[1]
          $manifest = Join-Path $plugin 'Contents/Resources/moduleinfo.json'
          if (-not (Test-Path $manifest)) { throw "Expected VST3 moduleinfo.json: $manifest" }
          $moduleText = Get-Content $manifest -Raw
          if ($moduleText -notmatch [regex]::Escape($expected)) { throw "VST3 metadata does not contain version $expected" }
          Write-Host "Built MixChecker Windows VST3 version $expected"

      - name: Upload unsigned VST3
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: MixChecker-vst3-unsigned
          path: build/MixChecker_artefacts/Release/VST3/MixChecker.vst3
          if-no-files-found: error
          retention-days: 7

  sign-release:
    if: vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
    steps:
      - name: Submit release artifact for SignPath signing
        id: signing
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.unsigned-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed VST3
        uses: actions/upload-artifact@v7
        with:
          name: MixChecker-vst3-signed
          path: signed
          if-no-files-found: error
          retention-days: 30
